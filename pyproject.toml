[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-compile"
version = "0.1.0"
description = "Compile FastMCP tools into secure ephemeral execution targets"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "MCP Compile"}]
license = {file = "LICENSE"}
keywords = ["mcp", "github-actions", "automation", "security"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: MIT License",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
demo = ["fastmcp>=2.0"]
test = ["pytest>=8", "fastmcp>=2.0"]

[project.scripts]
mcp-compile = "mcp_compiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
